<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Estate Operation Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --accent-900:#00463e;
    --accent-700:#00564f;
    --accent-600:#006d65;
    --accent-500:#008e82;
    --accent-400:#00b3a3;
    --accent-300:#00d0bc;
    --accent-200:#cfefea;
    --surface-tint:#e3f5f2;
    --surface-tint-strong:#c7ece6;
    --neutral-50:#f6f7f7;
    --neutral-0:#ffffff;
    --ink-900:#16231f;
    --ink-600:#3d4c48;
    --ink-500:#5b6b67;
    --line:#dce3e1;
    --line-strong:#c3cdca;
    --good:#2e9e5b;
    --good-bg:#e4f4ea;
    --warn:#b9791c;
    --warn-bg:#faf1de;
    --critical:#c3473b;
    --critical-bg:#fbe9e7;
    --page-bg:#eef1f0;
    /* new tokens - tab nav (no equivalent in the 7-file statics) */
    --tab-inactive-bg:#26302f;
    --tab-active-bg:#c7ece6;
    --tab-active-border:#006d65;
    --tab-active-ink:#00463e;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--page-bg);color:var(--ink-900);overflow:hidden;
    font-family:"Roboto","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;cursor:pointer;}
  .mono{font-family:ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Liberation Mono",monospace;
    font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:-0.01em;}

  .fit{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  .canvas{width:1600px;height:900px;flex:0 0 auto;transform-origin:center center;
    overflow:hidden;background:var(--neutral-50);border:1px solid var(--line-strong);
    padding:14px;display:flex;flex-direction:column;gap:9px;}

  /* ---------- topbar ---------- */
  .topbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:24px;
    padding:0 26px;height:62px;color:#fff;background:#00695c;border-radius:16px;}
  .topbar-brand{display:flex;align-items:center;gap:14px;}
  .topbar-logo{display:flex;align-items:center;flex:0 0 auto;background:#fff;border-radius:9px;
    padding:7px 12px;}
  .topbar-logo img{height:22px;width:auto;display:block;}
  .topbar-brand h1{font-size:15px;margin:0;font-weight:700;letter-spacing:0.01em;color:#fff;}
  .topbar-brand .eyebrow{font-size:9px;text-transform:uppercase;letter-spacing:0.09em;opacity:0.75;font-weight:600;margin-bottom:1px;display:block;color:var(--accent-200);}
  .topbar-ctx{display:flex;align-items:center;gap:22px;}
  .topbar-ctx .cx{text-align:right;}
  .topbar-ctx .cx b{display:block;font-size:13px;font-weight:800;color:#fff;line-height:1.2;}
  .topbar-ctx .cx span{display:block;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-200);opacity:.85;font-weight:700;margin-top:2px;}

  /* tab nav - new tokens - separate row BELOW the topbar, not inside it */
  .tabbar{flex:0 0 auto;display:flex;justify-content:flex-end;}
  .tabnav{display:flex;align-items:center;gap:7px;}
  .tabnav button{border:1.5px solid transparent;border-radius:7px;padding:8px 14px;font-size:10.5px;
    font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:var(--tab-inactive-bg);
    color:#cfe3df;transition:background .15s,color .15s;}
  .tabnav button:hover{color:#fff;}
  .tabnav button.active{background:var(--tab-active-bg);border-color:var(--tab-active-border);color:var(--tab-active-ink);}

  /* ---------- main grid ---------- */
  .grid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:230px 1fr;gap:9px;}
  .rail{display:flex;flex-direction:column;gap:9px;min-height:0;height:100%;overflow-y:auto;}
  .rail .panel{flex:0 0 auto;box-shadow:none;}
  .col{display:flex;flex-direction:column;gap:9px;min-height:0;height:100%;overflow-y:auto;overflow-x:hidden;}
  .rail::-webkit-scrollbar,.col::-webkit-scrollbar,.dd-menu::-webkit-scrollbar{width:6px;}
  .rail::-webkit-scrollbar-thumb,.col::-webkit-scrollbar-thumb,.dd-menu::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px;}
  .rail::-webkit-scrollbar-track,.col::-webkit-scrollbar-track,.dd-menu::-webkit-scrollbar-track{background:transparent;}

  /* filter fields */
  .field{display:flex;flex-direction:column;gap:3px;margin-bottom:8px;}
  .field label{font-size:8.5px;color:var(--ink-500);text-transform:uppercase;
    letter-spacing:0.04em;font-weight:700;}
  .btn{border:none;border-radius:6px;padding:5px 9px;font-size:10px;font-weight:700;
    cursor:pointer;font-family:inherit;}
  .btn-reset{background:transparent;border:1px solid var(--line-strong);color:var(--ink-500);
    width:100%;margin-top:9px;}
  .btn-reset:hover{border-color:var(--accent-500);color:var(--accent-600);}

  /* dropdown-button (Tableau "Single Value Dropdown" look) — unified for Region/Area/Estate:
     button face shows the field name itself (REGION/AREA/ESTATE), no separate caption label */
  .dd{position:relative;}
  .dd-btn{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;
    background:var(--neutral-0);border:1px solid var(--line-strong);border-radius:6px;
    padding:6px 8px;font-size:10px;font-weight:700;color:var(--ink-900);text-align:left;
    text-transform:uppercase;letter-spacing:0.05em;}
  .dd-btn .chev{flex:0 0 auto;width:7px;height:7px;border-right:2px solid var(--ink-500);
    border-bottom:2px solid var(--ink-500);transform:rotate(45deg);transition:transform .15s;}
  .dd-btn.open .chev{transform:rotate(225deg);}
  .dd-menu{position:absolute;left:0;right:0;top:calc(100% + 3px);z-index:20;background:var(--neutral-0);
    border:1px solid var(--line-strong);border-radius:6px;box-shadow:4px 6px 9px -3px rgba(15,23,42,0.22);
    overflow-y:auto;max-height:180px;}
  .dd-menu .dd-opt{padding:6px 9px;font-size:11px;font-weight:600;color:var(--ink-600);cursor:pointer;}
  .dd-menu .dd-opt:hover{background:var(--surface-tint);color:var(--ink-900);}
  .dd-menu .dd-opt.active{background:var(--surface-tint-strong);color:var(--ink-900);font-weight:700;}

  /* measure switch, appended inline inside Estate Selection panel */
  .mswitch-inline{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
  .mswitch{display:flex;gap:4px;}
  .mswitch button{flex:1;text-align:center;font-size:8.5px;font-weight:700;padding:5px 2px;
    border-radius:999px;border:1px solid var(--line-strong);background:transparent;
    color:var(--ink-500);font-family:inherit;cursor:pointer;}
  .mswitch button.active{background:var(--accent-600);border-color:var(--accent-600);color:#fff;}

  /* period pills */
  .period-toggle{display:flex;gap:4px;margin-bottom:8px;}
  .period-toggle button{flex:1;text-align:center;font-size:8.5px;font-weight:700;padding:4px 2px;
    border-radius:999px;border:1px solid var(--line-strong);background:transparent;
    color:var(--ink-500);font-family:inherit;cursor:pointer;}
  .period-toggle button.active{background:var(--accent-600);border-color:var(--accent-600);color:#fff;}
  .date-field{font-size:9px;font-weight:700;color:var(--ink-600);background:var(--surface-tint);
    border:1px solid var(--surface-tint-strong);padding:4px 8px;border-radius:6px;}

  /* legend */
  .legend-item{display:flex;align-items:center;gap:7px;font-size:9.5px;color:var(--ink-600);padding:3px 0;}
  .legend-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .legend-dot.good{background:var(--good);}
  .legend-dot.warn{background:var(--warn);}
  .legend-dot.critical{background:var(--critical);}

  /* page header */
  .page-head{flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .page-head h1{font-size:15px;margin:0;font-weight:700;color:var(--ink-900);}
  .page-head .period-note{font-size:9.5px;font-weight:700;color:var(--ink-500);}

  /* ---------- panels ---------- */
  .panel{background:var(--neutral-0);border:1px solid var(--line);border-radius:9px;
    display:flex;flex-direction:column;min-height:0;overflow:hidden;
    box-shadow:4px 6px 9px -3px rgba(15,23,42,0.22);}
  .panel-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:7px 11px 6px;border-bottom:1px solid var(--line);}
  .panel-head h2{font-size:10px;margin:0;font-weight:700;text-transform:uppercase;
    letter-spacing:0.05em;color:var(--ink-500);}
  .panel-head .sub{font-size:9px;font-weight:700;color:var(--ink-500);}
  .panel-body{flex:1 1 auto;min-height:0;padding:9px 11px;display:flex;flex-direction:column;gap:7px;}
  .row{display:flex;gap:9px;min-height:0;}
  .row>.panel{flex:1 1 0;min-width:0;}
  .row>.cmp-grid{flex:1 1 0;min-width:0;}

  /* KPI */
  .kpi{display:flex;flex-direction:column;gap:4px;}
  .kpi .k-label{font-size:9px;font-weight:700;color:var(--ink-500);
    text-transform:uppercase;letter-spacing:0.05em;}
  .kpi .k-value{font-size:24px;font-weight:700;color:var(--ink-900);line-height:1.1;}
  .kpi .k-value .k-of{font-size:11px;font-weight:700;color:var(--ink-500);margin-left:5px;}
  .kpi .k-sub{font-size:9px;color:var(--ink-500);font-weight:700;}
  .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;
    font-size:10px;font-weight:700;}
  .badge.good{color:var(--good);background:var(--good-bg);}
  .badge.warn{color:var(--warn);background:var(--warn-bg);}
  .badge.critical{color:var(--critical);background:var(--critical-bg);}
  .pbar{position:relative;height:7px;background:var(--line);border-radius:4px;overflow:hidden;}
  .pbar .fill{position:absolute;top:0;left:0;height:100%;border-radius:4px;}
  .fill.good{background:var(--good);}
  .fill.warn{background:var(--warn);}
  .fill.critical{background:var(--critical);}

  /* metric rows */
  .mrow{display:flex;flex-direction:column;gap:3px;}
  .mrow .m-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
    font-size:9.5px;font-weight:700;color:var(--ink-600);}
  .mrow .m-top .m-val{font-size:11px;color:var(--ink-900);}
  .mrow .m-lim{font-size:8.5px;font-weight:700;color:var(--ink-500);}

  /* chart host */
  .chart{flex:1 1 auto;min-height:0;position:relative;}
  .chart canvas{position:absolute;inset:0;width:100%!important;height:100%!important;}
  .clegend{display:flex;align-items:center;gap:14px;}
  .clegend .ci{display:flex;align-items:center;gap:5px;font-size:9px;font-weight:700;
    color:var(--ink-600);}
  .clegend .cs{width:10px;height:10px;border-radius:2px;flex:0 0 auto;}
  .cs.actual{background:var(--accent-600);}
  .cs.budget{background:var(--accent-200);}

  /* date controls */
  .datebox{display:flex;align-items:center;gap:6px;background:var(--neutral-0);
    border:1px solid var(--line-strong);border-radius:4px;padding:5px 8px;font-size:9.5px;
    font-weight:700;color:var(--ink-900);}
  .datebox .cal-icon{flex:0 0 auto;width:12px;height:12px;color:var(--ink-500);}
  .daterange{display:flex;flex-direction:column;gap:7px;}
  .daterange .dr-row{display:flex;align-items:center;gap:5px;}
  .daterange .dr-row .datebox{flex:1 1 0;min-width:0;padding:5px 6px;font-size:9px;}
  .daterange .dr-sep{font-size:9px;color:var(--ink-500);font-weight:700;flex:0 0 auto;}
  .dr-slider{position:relative;height:3px;background:var(--line);border-radius:2px;margin:1px 4px 5px;}
  .dr-slider .dr-fill{position:absolute;top:0;height:100%;background:var(--accent-600);border-radius:2px;}
  .dr-slider .dr-handle{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;
    background:var(--neutral-0);border:2px solid var(--accent-600);transform:translate(-50%,-50%);}
  .yearpick{position:relative;}
  .yearpick select{width:100%;appearance:none;-webkit-appearance:none;background:var(--neutral-0);
    border:1px solid var(--line-strong);border-radius:4px;padding:5px 22px 5px 8px;font-size:10px;
    font-weight:700;color:var(--ink-900);font-family:inherit;cursor:pointer;}
  .yearpick::after{content:"";position:absolute;right:8px;top:50%;width:5px;height:5px;
    border-right:2px solid var(--ink-500);border-bottom:2px solid var(--ink-500);
    transform:translateY(-70%) rotate(45deg);pointer-events:none;}

  /* ===== page-specific ===== */
  .kpi-row-single .panel-body{flex-direction:row;align-items:center;gap:22px;}
  .kpi-row-single .kpi{flex:0 0 auto;min-width:150px;}
  .kpi-row-single .pbar-wrap{flex:1 1 auto;display:flex;flex-direction:column;gap:5px;}
  .kpi-row-single .pbar-top{display:flex;justify-content:space-between;font-size:9px;font-weight:700;color:var(--ink-500);}

  /* Daily FFB production panel */
  .ffb-stats{display:flex;align-items:center;gap:16px;flex:0 0 auto;}
  .ffb-stats .kpi{flex:0 0 auto;min-width:0;}
  .ffb-stats .kpi .k-value{font-size:20px;}
  .ffb-ring{flex:0 0 auto;width:74px;height:74px;position:relative;}
  .ffb-ring canvas{position:absolute;inset:0;}
  .ffb-ring .ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:800;color:var(--ink-900);}
  .mini-table{width:100%;border-collapse:collapse;font-size:10px;flex:0 0 auto;}
  .mini-table th{font-size:8.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-500);
    text-align:right;padding:4px 0;border-bottom:1px solid var(--line);font-weight:700;}
  .mini-table td{text-align:right;padding:4px 0;border-bottom:1px solid var(--line);font-weight:700;color:var(--ink-900);}
  .mini-table th:first-child,.mini-table td:first-child{text-align:left;color:var(--ink-600);}
  .mini-table tr:last-child td{border-bottom:none;}

  /* FFB restan */
  .restan-wrap{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;}
  .restan-value{font-size:34px;font-weight:800;color:var(--ink-900);text-align:center;}
  .restan-value .k-of{font-size:13px;font-weight:700;color:var(--ink-500);margin-left:4px;}
  .restan-foot{display:flex;align-items:center;gap:8px;}

  /* 4-up kpi icon row */
  .kpi-icon{display:flex;align-items:center;gap:10px;padding:6px 2px;}
  .kpi-icon .ic{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--accent-600);
    display:flex;align-items:center;justify-content:center;}
  .kpi-icon .ic svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .kpi-icon .kb{flex:1 1 auto;min-width:0;}
  .kpi-icon h4{margin:0 0 3px;font-size:9.5px;font-weight:700;color:var(--ink-500);text-transform:uppercase;letter-spacing:.03em;}
  .kpi-icon .two{display:flex;justify-content:space-between;align-items:baseline;gap:6px;}
  .kpi-icon .v{font-size:18px;font-weight:800;color:var(--ink-900);}
  .kpi-icon .v small{font-size:10px;font-weight:700;color:var(--ink-500);margin-left:2px;}
  .kpi-icon .m{font-size:9px;color:var(--ink-500);font-weight:700;}
  .kpi-icon .dualv{display:flex;gap:14px;}
  .kpi-icon .dualv .dv b{display:block;font-size:15px;color:var(--ink-900);}
  .kpi-icon .dualv .dv span{font-size:8.5px;color:var(--ink-500);font-weight:700;}

  /* quality grid (6 metrics, 2x3) */
  .quality-grid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr 1fr;gap:9px 18px;}
  .quality-grid .mrow .pbar{margin-top:1px;}

  /* fertilizer page specific */
  .foot-note{flex:0 0 auto;font-size:8.5px;color:var(--ink-500);line-height:1.3;}
  .chart-subtitle{font-size:9px;font-weight:700;color:var(--ink-500);}

  /* output & loss measure (area level) */
  .loss-cols{display:flex;gap:9px;flex:1 1 auto;min-height:0;}
  .loss-col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px;
    border-right:1px solid var(--line);padding-right:9px;}
  .loss-col:last-child{border-right:none;padding-right:0;}
  .loss-col .m-top{align-items:center;}
  .loss-value{font-size:19px;font-weight:700;color:var(--ink-900);line-height:1.1;}
  .loss-value .k-of{font-size:10px;font-weight:700;color:var(--ink-500);margin-left:4px;}
  .kpi-badge-row{display:flex;align-items:center;gap:8px;}

  /* estate-level production specifics */
  .kpi4-row .panel-body{gap:9px;justify-content:center;padding:14px 13px;}
  .kpi4-row .k-value{font-size:26px;}
  .akp-note{flex:0 0 auto;font-size:8px;font-weight:600;color:var(--ink-500);line-height:1.3;}
  .hk-kpis{display:flex;gap:14px;flex:1 1 auto;}
  .hk-kpis .kpi{flex:1 1 0;}
  .grading-body{flex-direction:row;align-items:center;gap:16px;}
  .grading-donut{flex:0 0 150px;height:150px;position:relative;}
  .grading-donut canvas{position:absolute;inset:0;}
  .grading-list{flex:1 1 auto;display:flex;flex-direction:column;gap:9px;}
  .grading-list .g-row{display:flex;align-items:center;gap:9px;}
  .grading-list .g-row.lead .g-label{font-size:12px;}
  .grading-list .g-row.lead .g-val{font-size:15px;}
  .grading-list .g-swatch{width:11px;height:11px;border-radius:3px;flex:0 0 auto;}
  .grading-list .g-label{flex:1 1 auto;font-size:10px;font-weight:700;color:var(--ink-600);}
  .grading-list .g-val{font-size:12px;font-weight:700;color:var(--ink-900);
    font-family:ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Liberation Mono",monospace;}
  .grading-list .g-cap{font-size:8.5px;font-weight:700;color:var(--ink-500);min-width:60px;text-align:right;}

  /* comparison grid */
  .chips-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
  .chips-row b{font-size:10.5px;color:var(--ink-600);margin-right:4px;}
  .chip{padding:5px 12px;border:1px solid var(--accent-400);border-radius:20px;background:var(--neutral-0);
    color:var(--accent-700);font-weight:700;font-size:10px;}
  .chip:hover{background:var(--accent-600);color:#fff;border-color:var(--accent-600);}
  .cmp-grid{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:185px;gap:9px;}
  .cmp-card .panel-body{padding:6px 9px 8px;}
  .cmp-card .m{font-size:8.5px;color:var(--ink-500);font-weight:700;margin-bottom:2px;}

  /* ranking tables */
  .ow{overflow-x:auto;flex:1 1 auto;}
  .rk{width:100%;border-collapse:collapse;font-size:11px;}
  .rk th{background:var(--accent-600);color:#fff;padding:7px 8px;text-align:center;font-size:9.5px;
    text-transform:uppercase;letter-spacing:.03em;border:0;}
  .rk td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;color:var(--ink-900);font-weight:600;}
  .rk td:nth-child(-n+3){text-align:left;}
  .rk td:first-child{text-align:center;}
  .rank-badge{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;
    background:var(--surface-tint);font-weight:800;font-size:10px;color:var(--ink-900);}
  .fin-bar{display:block;padding:3px 8px;border-radius:4px;font-weight:800;}
</style>
</head>
<body>
<div class="fit">
  <div class="canvas" id="canvas">

    <div class="topbar">
      <div class="topbar-brand">
        <div class="topbar-logo"><img src="primeagri.png" alt="Prime Agri Resources"></div>
        <div>
          <span class="eyebrow">POES &middot; Estate Operation</span>
          <h1>Estate Operation Dashboard</h1>
        </div>
      </div>
      <div class="topbar-ctx" id="topbarCtx"></div>
    </div>

    <div class="tabbar">
      <div class="tabnav" id="tabNav"></div>
    </div>

    <div class="grid">
      <div class="rail" id="rail"></div>
      <div class="col" id="col"></div>
    </div>

  </div>
</div>
<script>
/* ============================================================
   DATA — dummy figures reused 1:1 from the 7 static mockups and
   from Update Mock Up Estate Operation 2.html where noted.
   ============================================================ */
const ESTATES = [
  "ESTATE BABOTI","ESTATE BELIDA","ESTATE BUKIT MAKMUR","ESTATE BUKIT RAYA","ESTATE BUKIT SUBUR",
  "ESTATE CAHAYA MURNI","ESTATE DAMAI SEJAHTERA","ESTATE HARAPAN JAYA","ESTATE MEKAR SARI","ESTATE SUMBER REJEKI"
];
const DATES7 = ['10/10','11/10','12/10','13/10','14/10','15/10','16/10'];

// Production - Area - Daily - Measure=Production (8-panel, screenshot-driven)
const FFB_DAILY = {
  actual:903, budget:1000, achievement:90, achStatus:'warn',

function genTrend(n, start, end, noise){
  const arr=[];
  for(let i=0;i<n;i++){
    const base = start + (end-start)*i/(n-1);
    const wobble = (Math.sin(i*1.3)+Math.sin(i*0.7))*noise;
    arr.push(Math.round((base+wobble)*10)/10);
  }
  return arr;
}

function panel(title, bodyHtml, opts={}){
  const sub = opts.sub ? `<span class="sub">${opts.sub}</span>` : (opts.clegend || '');

}

function pbar(pct,status){ return `<div class="pbar"><div class="fill ${status}" style="width:${Math.min(100,pct)}%"></div></div>`; }

let CHARTS = [];
function destroyCharts(){ CHARTS.forEach(c=>c.destroy()); CHARTS = []; }

const ValueLabel = {
  id:'valueLabel',
  afterDatasetsDraw(chart){
    const opt = chart.options.plugins.valueLabel;
    if(!opt || !opt.show) return;
    const ctx = chart.ctx; const h = chart.options.indexAxis==='y';
    ctx.save(); ctx.font='700 9.5px Roboto, sans-serif'; ctx.fillStyle = V('--ink-900');
    chart.data.datasets.forEach((ds,i)=>{
      if(ds.noLabel) return;
      const meta = chart.getDatasetMeta(i);
      if(meta.hidden) return;
      meta.data.forEach((pt,j)=>{
        const v = ds.data[j]; if(v==null) return;
        ctx.textAlign = h ? 'left' : 'center';
        ctx.textBaseline = h ? 'middle' : 'bottom';
        const f = opt.formatter || (x=>fmt(x, opt.decimals||0));
        ctx.fillText(f(v), h? pt.x+6 : pt.x, h? pt.y : pt.y-4);
      });
    });
    ctx.restore();
  }
};
const CenterText = {
  id:'centerText',
  afterDraw(chart){
    const opt = chart.options.plugins.centerText;
    if(!opt || !opt.text) return;
    const {ctx, chartArea:{left,right,top,bottom}} = chart;
    const cx = (left+right)/2, cy = (top+bottom)/2;
    ctx.save();
    ctx.font = (opt.font||'800 15px Roboto, sans-serif');
    ctx.fillStyle = opt.color || V('--ink-900');
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(opt.text, cx, cy);
    ctx.restore();
  }
};
Chart.register(ValueLabel, CenterText);
Chart.defaults.font.family = "Roboto, 'Segoe UI', sans-serif";
Chart.defaults.color = V('--ink-500');

function mkChart(id, type, labels, datasets, opts={}){
  const el = document.getElementById(id);
  if(!el) return null;
  const h = opts.h;
  const c = new Chart(el, {
    type, data:{labels, datasets},
    options:{
      responsive:true, maintainAspectRatio:false, indexAxis: h?'y':'x',
      animation:{duration:450},
      onClick: (e,active)=>{ if(opts.clickEstate && active.length){ drillToEstate(ESTATES[active[0].index]); } },
      onHover: (e,active)=>{ if(opts.clickEstate) e.native.target.style.cursor = active.length?'pointer':'default'; },
      interaction:{mode:'index', intersect:false},
      plugins:{
        legend:{display:!!opts.legend, position:'top', align:'end', labels:{boxWidth:10, boxHeight:10, color:V('--ink-600'), font:{size:10, weight:'700'}}},
        tooltip:{displayColors:false, backgroundColor:'rgba(22,35,31,.94)', padding:9, cornerRadius:6, titleFont:{weight:'700'}},
        valueLabel:{show:opts.valueLabel, decimals:opts.decimals, formatter:opts.formatter},
        centerText: opts.centerText
      },
      scales: opts.noScales ? {} : {
        x:{stacked:opts.stack, grid:{display:h, color:V('--line')}, border:{display:false}, ticks:{color:V('--ink-500'), font:{size:9}}},
        y:{stacked:opts.stack, min:opts.min, max:opts.max, grid:{display:!h, color:V('--line')}, border:{display:false}, ticks:{color:V('--ink-500'), font:{size:9}}}
      }
    }
  });
  CHARTS.push(c);
  return c;
}
function mkLine(id, labels, data, target, opts={}){
  const ds = [{
    label:'Actual', data, borderColor:V('--accent-600'), backgroundColor:V('--accent-600')+'33',
    fill: opts.area ? 'origin' : false, borderWidth:2.5, pointRadius:3, pointBackgroundColor:V('--accent-600'), tension:.3
  }];
  if(target!=null){
    ds.push({label:'Target', data:data.map(()=>target), borderColor:V('--warn'), borderDash:[5,4],
      pointRadius:0, borderWidth:1.6, fill:false, noLabel:true});
  }
  return mkChart(id,'line',labels,ds,{legend:!!target, valueLabel:true, decimals:opts.decimals||0, min:opts.min, max:opts.max});
}
function mkDonut(id, pct, status){
  return mkChart(id,'doughnut',['Achieved','Remaining'],[{
    data:[pct, Math.max(0,100-pct)], backgroundColor:[statusColor(status), V('--line')], borderWidth:0
  }],{noScales:true, centerText:{text:pct+'%'}});
}
function mkGradingDonut(id, rows){
  return mkChart(id,'doughnut',rows.map(r=>r.name), [{
    data: rows.map(r=>r.value), backgroundColor: rows.map(r=>r.color), borderWidth:2, borderColor:V('--neutral-0')
  }],{noScales:true});
}

/* ============================================================
   RENDER / INTERACTION
   ============================================================ */
function renderContent(){
  destroyCharts();
  const titles = {production:'Production', quality:'FFB Quality &amp; Losses', fertilizer:'Fertilizer &amp; Upkeep',
    comparison: STATE.estate===null ? 'Comparison' : 'Harvester Ranking'};
  const subs = {production:'FFB production, quality, rotation &amp; attendance', quality:'FFB quality &amp; harvest losses',
    fertilizer:'Fertilizer application &amp; crop upkeep realisation',
    comparison: STATE.estate===null ? 'Comparison across estates in area' : 'Best and worst harvesters by estate'};

  const head = `<div class="page-head"><h1>${titles[STATE.tab]}${STATE.estate?' &mdash; '+STATE.estate:''}</h1><span class="period-note">${subs[STATE.tab]}</span></div>`;

  // page-specific functions each assign #col's full innerHTML (rows only, no head)
  if(STATE.tab==='production') pageProduction();
  else if(STATE.tab==='quality') pageQuality();
  else if(STATE.tab==='fertilizer') pageFertilizer();
  else if(STATE.tab==='comparison') (STATE.estate===null ? pageComparison() : pageRanking());

  $('#col').insertAdjacentHTML('afterbegin', head);
}

function renderAll(){
  renderSidebar();
  renderTopbar();
  renderContent();
}

function drillToEstate(name){
  STATE.estate = name;
  STATE.tab = 'production';
  openDropdown = null;
  renderAll();
  $('#col').scrollTop = 0;
}
function resetSelection(){
  STATE.estate = null;
  STATE.region = 'All Region';
  STATE.area = 'All Area';
  if(STATE.tab==='comparison'){ /* stays comparison tab key; label auto reverts */ }
  openDropdown = null;
  renderAll();
}
function clearEstateOnly(){
  STATE.estate = null;
  openDropdown = null;
  renderAll();
}

/* Delegated interaction wiring (survives full re-renders) */
document.addEventListener('click', (e)=>{
  const ddBtn = e.target.closest('.dd-btn');
  if(ddBtn){ const f = ddBtn.getAttribute('data-dd'); openDropdown = (openDropdown===f) ? null : f; renderSidebar(); return; }

  const ddOpt = e.target.closest('.dd-opt');
  if(ddOpt){
    const field = ddOpt.getAttribute('data-field'), val = ddOpt.getAttribute('data-val');
    if(field==='estate'){ val==='All Estate' ? clearEstateOnly() : drillToEstate(val); return; }
    if(field==='region') STATE.region = val; else if(field==='area') STATE.area = val;
    openDropdown = null; renderSidebar(); renderTopbar(); return;
  }

  const measureBtn = e.target.closest('.mswitch button');
  if(measureBtn){ STATE.measure = measureBtn.getAttribute('data-measure'); renderAll(); return; }

  const periodBtn = e.target.closest('.period-toggle button');
  if(periodBtn){ STATE.period = periodBtn.getAttribute('data-period'); renderAll(); return; }

  if(e.target.id==='resetSel'){ resetSelection(); return; }

  const tabBtn = e.target.closest('.tabnav button');
  if(tabBtn){ STATE.tab = tabBtn.getAttribute('data-tab'); renderAll(); return; }

  const chip = e.target.closest('.chip');
  if(chip){ drillToEstate(chip.getAttribute('data-estate')); return; }

  // close any open dropdown on outside click
  if(openDropdown && !e.target.closest('.dd')){ openDropdown = null; renderSidebar(); }
});

/* viewport fit */
(function(){
  const c = document.getElementById('canvas');
  function fit(){ const s = Math.min(window.innerWidth/1600, window.innerHeight/900); c.style.transform = 'scale(' + s + ')'; }
  fit(); window.addEventListener('resize', fit);
})();

renderAll();
</script>
</body>
</html>
