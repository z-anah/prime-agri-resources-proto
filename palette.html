<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRIME AGRI RESOURCES - Color Palette Showcase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'prime-green': '#006D65',
            'prime-mint': '#00D0BC',
            'prime-deep': '#00463E',
            'prime-black': '#000000',
            'prime-white': '#FFFFFF',
            'target-gold': '#F59E0B',
            'soft-bg': '#F8FAFC',
            'card-border': '#E2E8F0',
            'slate-sub': '#94A3B8'
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #F8FAFC;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased text-slate-800">
  <div id="app" class="flex flex-col min-h-screen">

    <!-- Main Content -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-8">

      <!-- Primary Palette Section -->
      <section class="mb-8">
        <h2 class="text-xs font-extrabold text-slate-sub uppercase tracking-widest mb-4">Primary Palette</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div v-for="color in primaryPalette" :key="color.name" class="bg-white rounded-xl p-4 border border-card-border shadow-sm flex items-center justify-between">
            <div class="flex items-center space-x-4">
              <div class="w-14 h-14 rounded-lg shadow-inner border border-black/5" :style="{ backgroundColor: color.hex }"></div>
              <div>
                <h3 class="text-sm font-black text-slate-800">{{ color.name }}</h3>
                <span class="text-xs font-bold text-prime-green font-mono">{{ color.hex }}</span>
              </div>
            </div>
            <button @click="copyHex(color.hex)" class="px-3 py-1.5 bg-soft-bg hover:bg-card-border rounded-lg text-xs font-bold text-slate-600 transition flex items-center gap-1.5">
              <i class="fas fa-copy"></i> Copy
            </button>
          </div>
        </div>
      </section>

      <!-- Sub Color Palette Section -->
      <section class="mb-8">
        <h2 class="text-xs font-extrabold text-slate-sub uppercase tracking-widest mb-4">Sub Color Palette</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div v-for="color in subPalette" :key="color.name" class="bg-white rounded-xl p-4 border border-card-border shadow-sm flex items-center justify-between">
            <div class="flex items-center space-x-4">
              <div class="w-12 h-12 rounded-lg shadow-inner border border-black/10" :style="{ backgroundColor: color.hex }"></div>
              <div>
                <h3 class="text-xs font-black text-slate-800">{{ color.name }}</h3>
                <span class="text-[11px] font-bold text-slate-sub font-mono">{{ color.hex }}</span>
              </div>
            </div>
            <button @click="copyHex(color.hex)" class="p-2 bg-soft-bg hover:bg-card-border rounded-lg text-xs font-bold text-slate-600 transition">
              <i class="fas fa-copy"></i>
            </button>
          </div>
        </div>
      </section>

      <!-- Extended Admin Accents Section -->
      <section>
        <h2 class="text-xs font-extrabold text-slate-sub uppercase tracking-widest mb-4">Extended Admin Accents</h2>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div v-for="color in accentPalette" :key="color.name" class="bg-white rounded-xl p-4 border border-card-border shadow-sm flex items-center justify-between">
            <div class="flex items-center space-x-4">
              <div class="w-12 h-12 rounded-lg shadow-inner border border-black/10" :style="{ backgroundColor: color.hex }"></div>
              <div>
                <h3 class="text-xs font-black text-slate-800">{{ color.name }}</h3>
                <span class="text-[11px] font-bold text-slate-sub font-mono">{{ color.hex }}</span>
              </div>
            </div>
            <button @click="copyHex(color.hex)" class="p-2 bg-soft-bg hover:bg-card-border rounded-lg text-xs font-bold text-slate-600 transition">
              <i class="fas fa-copy"></i>
            </button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          primaryPalette: [
            { name: 'PRIME GREEN', hex: '#006D65' },
            { name: 'PRIME MINT', hex: '#00D0BC' }
          ],
          subPalette: [
            { name: 'PRIME DEEP GREEN', hex: '#00463E' },
            { name: 'PRIME BLACK', hex: '#000000' },
            { name: 'PRIME WHITE', hex: '#FFFFFF' }
          ],
          accentPalette: [
            { name: 'AMBER / TARGET GOLD', hex: '#F59E0B' },
            { name: 'SOFT AMBER BG', hex: '#FEF3C7' },
            { name: 'SUCCESS GREEN', hex: '#10B981' },
            { name: 'SOFT GREEN BG', hex: '#D1FAE5' },
            { name: 'WARNING / ALERT RED', hex: '#EF4444' },
            { name: 'SOFT RED BG', hex: '#FEE2E2' },
            { name: 'SOFT BG GREY', hex: '#F8FAFC' },
            { name: 'CARD BORDER / SLATE', hex: '#E2E8F0' }
          ]
        }
      },
      methods: {
        copyHex(hex) {
          navigator.clipboard.writeText(hex);
          alert('Copied color hex: ' + hex);
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
